[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taskgenerator"
version = "0.1.0"
description = "Report-first GDPVal-style real-world task generation pipeline."
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4==4.15.0",
  "openai==2.44.0",
  "pydantic>=2",
  "openpyxl",
  "requests",
]

[project.scripts]
taskgen-produce = "task_generator.cli.production:main"
taskgen-evaluate = "task_generator.cli.evaluate:main"
taskgen-release = "task_generator.cli.release:main"

[tool.setuptools.packages.find]
where = ["src"]
